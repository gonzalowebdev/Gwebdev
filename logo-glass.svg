<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="GWD">
  <title>GWD</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#235aa8"/><stop offset="0.55" stop-color="#143a78"/><stop offset="1" stop-color="#0a1a3d"/>
    </linearGradient>
    <radialGradient id="bOr" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#f5a623" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fb5a8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#2fb5a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2fb5a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4aa3ff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#4aa3ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4aa3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b8b" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ff6b8b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6b8b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/><stop offset="0.6" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe7ff"/>
    </linearGradient>
    <linearGradient id="brk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="sheenG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sRed" cx="0.5" cy="0.5" r="0.5" fx="0.32" fy="0.28">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#ff6a57"/>
      <stop offset="1" stop-color="#a8261a"/>
    </radialGradient>
    <radialGradient id="sTeal" cx="0.5" cy="0.5" r="0.5" fx="0.32" fy="0.28">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#33d9c6"/>
      <stop offset="1" stop-color="#0f7f74"/>
    </radialGradient>
    <radialGradient id="sBlue" cx="0.5" cy="0.5" r="0.5" fx="0.32" fy="0.28">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#4ea4ff"/>
      <stop offset="1" stop-color="#1b4f9c"/>
    </radialGradient>
    <radialGradient id="sCyan" cx="0.5" cy="0.5" r="0.5" fx="0.32" fy="0.28">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#a6ecff"/>
      <stop offset="1" stop-color="#3aa8d6"/>
    </radialGradient>
    <radialGradient id="hBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ea4ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#4ea4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4ea4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9be9ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#9be9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9be9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#33d9c6" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#33d9c6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#33d9c6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1024" height="1024" rx="236"/></clipPath>
    <clipPath id="cardClip"><rect x="190" y="200" width="644" height="624" rx="112"/></clipPath>
  </defs>

  <style>
    .fl, .hl, .sheen { transform-box: fill-box; }
    .fl { transform-origin: center; animation: fl 3.2s ease-in-out infinite; }
    .hl { transform-origin: center; opacity: .25; animation: hl 3.2s ease-in-out infinite; }
    .o2 { animation-delay: .55s; }
    .o3 { animation-delay: 1.1s; }
    .sheen { animation: sheen 6s ease-in-out infinite; }
    @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-22px); } }
    @keyframes hl { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.3); } }
    @keyframes sheen { 0%, 55% { transform: translateX(-700px); } 100% { transform: translateX(700px); } }
    @media (prefers-reduced-motion: reduce) {
      .fl, .hl, .sheen { animation: none; }
      .hl { opacity: .6; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- Luces de fondo (lo que "refracta" el vidrio) -->
    <circle cx="250" cy="210" r="300" fill="url(#bOr)" opacity="0.85"/>
    <circle cx="800" cy="300" r="320" fill="url(#bTeal)" opacity="0.8"/>
    <circle cx="470" cy="880" r="330" fill="url(#bBlue)" opacity="0.9"/>
    <circle cx="850" cy="850" r="230" fill="url(#bPink)" opacity="0.7"/>

    <!-- Esquinas -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#f5a623" stroke-opacity="0.28" stroke-width="40">
        <path d="M142 214V142H214"/><path d="M882 214V142H810"/><path d="M126 838V902H198"/><path d="M898 838V902H826"/>
      </g>
      <g stroke="url(#brk)" stroke-width="20">
        <path d="M142 214V142H214"/><path d="M882 214V142H810"/><path d="M126 838V902H198"/><path d="M898 838V902H826"/>
      </g>
    </g>

    <!-- Tarjeta de vidrio -->
    <rect x="190" y="212" width="644" height="624" rx="112" fill="#04112b" opacity="0.35"/>
    <rect x="190" y="200" width="644" height="624" rx="112" fill="url(#glassFill)"/>
    <rect x="190" y="200" width="644" height="624" rx="112" fill="none" stroke="url(#glassStroke)" stroke-width="5"/>
    <path d="M232 262C300 214 420 206 512 206" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
    <g clip-path="url(#cardClip)"><rect class="sheen" x="140" y="150" width="140" height="760" fill="url(#sheenG)" transform="rotate(18 512 512)"/></g>

    <!-- Luces superiores -->
    <g>
      <circle cx="330" cy="305" r="36" fill="url(#sRed)"/>
      <circle cx="512" cy="305" r="36" fill="url(#sTeal)"/>
      <circle cx="694" cy="305" r="36" fill="url(#sRed)"/>
    </g>

    <!-- Letras GWD -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="66">
        <path d="M379 471A74 88 0 1 0 379 559L379 520L322 520"/>
        <path d="M437 430L470 598L512 480L554 598L587 430"/>
        <path d="M640 430V600H690C748 600 784 566 784 515C784 464 748 430 690 430Z"/>
      </g>
      <g stroke="url(#txt)" stroke-width="46">
        <path d="M379 471A74 88 0 1 0 379 559L379 520L322 520"/>
        <path d="M437 430L470 598L512 480L554 598L587 430"/>
        <path d="M640 430V600H690C748 600 784 566 784 515C784 464 748 430 690 430Z"/>
      </g>
    </g>

    <!-- Luces inferiores (flotan y brillan en secuencia) -->
    <circle class="hl" cx="330" cy="730" r="78" fill="url(#hBlue)"/>
    <circle class="hl o2" cx="512" cy="730" r="78" fill="url(#hCyan)"/>
    <circle class="hl o3" cx="694" cy="730" r="78" fill="url(#hTeal)"/>
    <circle class="fl" cx="330" cy="730" r="36" fill="url(#sBlue)"/>
    <circle class="fl o2" cx="512" cy="730" r="36" fill="url(#sCyan)"/>
    <circle class="fl o3" cx="694" cy="730" r="36" fill="url(#sTeal)"/>
  </g>
</svg>
