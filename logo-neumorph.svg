<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="GWD">
  <title>GWD</title>
  <defs>
    <linearGradient id="convex" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2fa"/><stop offset="1" stop-color="#d8deea"/></linearGradient>
    <linearGradient id="concave" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9dfeb"/><stop offset="1" stop-color="#eef2fa"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b87ff"/><stop offset="1" stop-color="#2a50c4"/></linearGradient>
    <linearGradient id="brk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc64d"/><stop offset="1" stop-color="#f09a00"/></linearGradient>
    <radialGradient id="hB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3d6df2" stop-opacity=".9"/><stop offset="1" stop-color="#3d6df2" stop-opacity="0"/></radialGradient>
    <radialGradient id="hC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#38c6f4" stop-opacity=".9"/><stop offset="1" stop-color="#38c6f4" stop-opacity="0"/></radialGradient>
    <radialGradient id="hT" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#19b8a6" stop-opacity=".9"/><stop offset="1" stop-color="#19b8a6" stop-opacity="0"/></radialGradient>

    <!-- Relieve grande (tarjeta) -->
    <filter id="raised" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow in="SourceGraphic" dx="22" dy="22" stdDeviation="20" flood-color="#8c9db8" flood-opacity=".95" result="a"/>
      <feDropShadow in="SourceGraphic" dx="-22" dy="-22" stdDeviation="20" flood-color="#ffffff" flood-opacity="1" result="b"/>
      <feMerge><feMergeNode in="a"/><feMergeNode in="b"/></feMerge>
    </filter>
    <!-- Relieve pequeño (botones, letras) -->
    <filter id="raisedS" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow in="SourceGraphic" dx="9" dy="9" stdDeviation="8" flood-color="#8c9db8" flood-opacity=".95" result="a"/>
      <feDropShadow in="SourceGraphic" dx="-9" dy="-9" stdDeviation="8" flood-color="#ffffff" flood-opacity="1" result="b"/>
      <feMerge><feMergeNode in="a"/><feMergeNode in="b"/></feMerge>
    </filter>
    <!-- Hundido -->
    <filter id="inset" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="14" result="blur"/>
      <feOffset in="blur" dx="14" dy="14" result="o1"/>
      <feFlood flood-color="#8c9db8" flood-opacity=".95"/><feComposite in2="o1" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="dark"/>
      <feOffset in="blur" dx="-14" dy="-14" result="o2"/>
      <feFlood flood-color="#ffffff" flood-opacity="1"/><feComposite in2="o2" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="light"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
    </filter>
    <filter id="insetS" x="-30%" y="-30%" width="160%" height="160%">
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="6" dy="6" result="o1"/>
      <feFlood flood-color="#8c9db8" flood-opacity=".95"/><feComposite in2="o1" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="dark"/>
      <feOffset in="blur" dx="-6" dy="-6" result="o2"/>
      <feFlood flood-color="#ffffff" flood-opacity="1"/><feComposite in2="o2" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="light"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
    </filter>
  </defs>

  <style>
    .btn3, .halo { transform-box: fill-box; transform-origin: center; }
    .btn3 { animation: press 3.6s ease-in-out infinite; }
    .halo { opacity: .15; animation: glow 3.6s ease-in-out infinite; }
    .led { opacity: .45; animation: ledon 3.6s ease-in-out infinite; }
    .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.2s; }
    @keyframes press { 0%, 38%, 100% { transform: translateY(0) scale(1); } 8% { transform: translateY(6px) scale(.93); } 18% { transform: translateY(0) scale(1.02); } }
    @keyframes glow { 0%, 38%, 100% { opacity: .15; transform: scale(.7); } 8%, 22% { opacity: 1; transform: scale(1.25); } }
    @keyframes ledon { 0%, 38%, 100% { opacity: .45; } 8%, 24% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .btn3, .halo, .led { animation: none; } .halo { opacity: .5; } .led { opacity: 1; } }
  </style>

  <!-- Cuerpo en relieve -->
  <rect x="100" y="100" width="824" height="824" rx="210" fill="url(#convex)" filter="url(#raised)"/>

  <!-- Esquinas naranjas -->
  <g fill="none" stroke="url(#brk)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M185 272V205H252"/><path d="M839 272V205H772"/><path d="M185 752V819H252"/><path d="M839 752V819H772"/>
  </g>

  <!-- Pantalla hundida -->
  <rect x="250" y="250" width="524" height="524" rx="110" fill="url(#concave)" filter="url(#inset)"/>

  <!-- Luces superiores (pozos hundidos con LED) -->
  <g>
    <circle cx="355" cy="335" r="36" fill="url(#concave)" filter="url(#insetS)"/><circle cx="355" cy="335" r="15" fill="#e0533f"/>
    <circle cx="512" cy="335" r="36" fill="url(#concave)" filter="url(#insetS)"/><circle cx="512" cy="335" r="15" fill="#19b8a6"/>
    <circle cx="669" cy="335" r="36" fill="url(#concave)" filter="url(#insetS)"/><circle cx="669" cy="335" r="15" fill="#e0533f"/>
  </g>

  <!-- Letras GWD en relieve -->
  <g fill="none" stroke="url(#ink)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#raisedS)">
    <path d="M400 474A52 62 0 1 0 400 536L400 505L360 505"/>
    <path d="M440 445L468 565L512 485L556 565L584 445"/>
    <path d="M622 445V565H664C706 565 726 540 726 505C726 470 706 445 664 445Z"/>
  </g>

  <!-- Luces inferiores: botones que se presionan en secuencia -->
  <circle class="halo" cx="355" cy="690" r="78" fill="url(#hB)"/>
  <circle class="halo d2" cx="512" cy="690" r="78" fill="url(#hC)"/>
  <circle class="halo d3" cx="669" cy="690" r="78" fill="url(#hT)"/>
  <g class="btn3"><circle cx="355" cy="690" r="44" fill="url(#convex)" filter="url(#raisedS)"/><circle class="led" cx="355" cy="690" r="16" fill="#3d6df2"/></g>
  <g class="btn3 d2"><circle cx="512" cy="690" r="44" fill="url(#convex)" filter="url(#raisedS)"/><circle class="led d2" cx="512" cy="690" r="16" fill="#38c6f4"/></g>
  <g class="btn3 d3"><circle cx="669" cy="690" r="44" fill="url(#convex)" filter="url(#raisedS)"/><circle class="led d3" cx="669" cy="690" r="16" fill="#19b8a6"/></g>
</svg>
